# The human test: 2 cursors, 1 claude, 1 codex.
# Double-click Open Crew.command, or:
#   python3 crew.py desk
# Then click Load all, or Load on one row. Loading sends no task or message.

channel = "desk"
cwd     = ".." # relative to this config: the repository checkout

[[seat]]
name    = "orch"
label   = "Orch"
role    = "orch"
effort  = "xhigh"
harness = "cursor-agent"
model   = "cursor-grok-4.6-xhigh-fast"
flags   = ["--force"]
prompt  = "prompts/orch-four.md"

[[seat]]
name    = "Scout"
label   = "Scout"
effort  = "high"
harness = "cursor-agent"
model   = "cursor-grok-4.6-xhigh-fast"
flags   = ["--force"]
prompt  = "prompts/cursor-four.md"

[[seat]]
name    = "Claude"
label   = "Claude"
effort  = "high"
harness = "claude"
model   = "sonnet"
prompt  = "prompts/claude-four.md"

[[seat]]
name    = "Codex"
label   = "Codex"
effort  = "high"
harness = "codex-cli"
model   = "gpt-5.6-sol"
prompt  = "prompts/codex-four.md"
