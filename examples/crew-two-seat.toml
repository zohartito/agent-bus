# Two visible seats plus an observer pane. From the repo root:
#
#   python3 crew.py up --dry-run examples/crew-two-seat.toml
#   python3 crew.py up examples/crew-two-seat.toml
#   python3 crew.py status examples/crew-two-seat.toml
#   python3 crew.py down examples/crew-two-seat.toml
#
# Starts real interactive agents. Do not put secrets in this file.

channel = "demo"
cwd     = ".." # relative to this config: the repository checkout

[[seat]]
name    = "orch"
harness = "cursor-agent"
model   = "cursor-grok-4.6-xhigh-fast"
flags   = ["--force"]
prompt  = "prompts/orchestrator.md"

[[seat]]
name    = "codex"
harness = "codex-cli"
model   = "gpt-5.6-sol"
prompt  = "prompts/peer.md"
